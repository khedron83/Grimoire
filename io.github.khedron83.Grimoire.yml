app-id: io.github.khedron83.Grimoire
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.python3
command: grimoire
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri
  - --env=PATH=/app/bin:/usr/bin:/usr/lib/sdk/python3/bin

modules:

  # ── Python pip dependencies ─────────────────────────────────────────────────
  # Generate/update these with:
  #   flatpak-pip-generator --runtime=org.freedesktop.Sdk//24.08 \
  #     PySide6 requests beautifulsoup4 lxml
  # Then include the output file here:
  - python3-deps.json

  # ── Grimoire ────────────────────────────────────────────────────────────────
  - name: grimoire
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/lib/python3/site-packages
        PATH: /usr/lib/sdk/python3/bin:/app/bin:/usr/bin
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 src/resources/icon.svg
          /app/share/icons/hicolor/scalable/apps/io.github.khedron83.Grimoire.svg
      - install -Dm644 io.github.khedron83.Grimoire.desktop
          /app/share/applications/io.github.khedron83.Grimoire.desktop
      - install -Dm644 io.github.khedron83.Grimoire.metainfo.xml
          /app/share/metainfo/io.github.khedron83.Grimoire.metainfo.xml
    sources:
      - type: dir
        path: .
