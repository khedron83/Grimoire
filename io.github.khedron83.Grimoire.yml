app-id: io.github.khedron83.Grimoire
base: io.qt.PySide.BaseApp
base-version: '6.9'
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: grimoire
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

modules:

  # ── Small pip dependencies (PySide6 comes from the BaseApp) ────────────────
  # Regenerate with:
  #   .venv/bin/python -m flatpak_pip_generator \
  #     --runtime org.freedesktop.Sdk//25.08 \
  #     --prefer-wheels lxml,charset-normalizer \
  #     requests beautifulsoup4 lxml \
  #     -o python3-deps.json
  - python3-deps.json

  # ── Grimoire ────────────────────────────────────────────────────────────────
  - name: grimoire
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 src/resources/icon.svg
          /app/share/icons/hicolor/scalable/apps/io.github.khedron83.Grimoire.svg
      - install -Dm644 io.github.khedron83.Grimoire.desktop
          /app/share/applications/io.github.khedron83.Grimoire.desktop
      - install -Dm644 io.github.khedron83.Grimoire.metainfo.xml
          /app/share/metainfo/io.github.khedron83.Grimoire.metainfo.xml
    sources:
      - type: dir
        path: .
