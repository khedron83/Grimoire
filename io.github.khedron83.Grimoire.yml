app-id: io.github.khedron83.Grimoire
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: grimoire
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/grimoire/cargo

modules:
  - name: grimoire
    buildsystem: simple
    build-commands:
      - npm --offline ci --cache ./flatpak-node/npm-cache
      - npm run build
      # cargo --offline requires cargo-sources.json (see below)
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/grimoire /app/bin/grimoire
      - install -Dm644 src/resources/icon.svg
          /app/share/icons/hicolor/scalable/apps/io.github.khedron83.Grimoire.svg
      - install -Dm644 io.github.khedron83.Grimoire.desktop
          /app/share/applications/io.github.khedron83.Grimoire.desktop
      - install -Dm644 io.github.khedron83.Grimoire.metainfo.xml
          /app/share/metainfo/io.github.khedron83.Grimoire.metainfo.xml
    sources:
      - type: dir
        path: .
      # ponytail: generate these once Cargo.lock + package-lock.json exist:
      #   python3 flatpak-cargo-generator.py src-tauri/Cargo.lock -o cargo-sources.json
      #   python3 flatpak-node-generator.py npm package-lock.json -o node-sources.json
      # (flatpak-builder-tools from https://github.com/flatpak/flatpak-builder-tools)
      - cargo-sources.json
      - node-sources.json
