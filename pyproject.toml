[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.scripts]
grimoire = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
