name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build
        run: pyinstaller eso_addon_manager.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESO-Addon-Manager-Windows
          path: dist/ESO Addon Manager/

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxcb-cursor0 \
            libxcb-xinerama0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build
        run: pyinstaller eso_addon_manager.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESO-Addon-Manager-Linux
          path: dist/ESO Addon Manager/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ESO-Addon-Manager-Windows
          path: release/windows/

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: ESO-Addon-Manager-Linux
          path: release/linux/

      - name: Zip artifacts
        run: |
          cd release
          zip -r ../ESO-Addon-Manager-Windows.zip windows/
          zip -r ../ESO-Addon-Manager-Linux.zip linux/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ESO-Addon-Manager-Windows.zip
            ESO-Addon-Manager-Linux.zip
          generate_release_notes: true
