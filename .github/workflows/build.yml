name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: grimoire-linux
          - os: windows-latest
            artifact: grimoire-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/
          retention-days: 30

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm deps
        run: npm ci

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-freedesktop-24.08

      - name: Install Flatpak runtime
        run: |
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Sdk.Extension.node22//24.08

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install --force-clean \
            build-dir io.github.khedron83.Grimoire.yml

      - name: Create bundle
        run: |
          flatpak build-bundle \
            ~/.local/share/flatpak/repo \
            grimoire.flatpak \
            io.github.khedron83.Grimoire \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-flatpak
          path: grimoire.flatpak
          retention-days: 30

  release:
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.flatpak
          generate_release_notes: true
